<body>
    <div class="container">

    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    try {
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#0a0a0a';
    } catch(e) {}

    const urlInput = document.getElementById('url');
    const downloadBtn = document.getElementById('downloadBtn');
    const donateBtn = document.getElementById('donateBtn');
    const tgLink = document.getElementById('tgLink');
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const videoInfo = document.getElementById('videoInfo');
    const videoTitle = document.getElementById('videoTitle');
    const videoAuthor = document.getElementById('videoAuthor');

    let currentVideo = null;
    let currentUserData = null;

    function getUserData() {
        let userId = 0;
        let username = 'lonely_soul';
        let chatId = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('user_id');
        const urlUsername = urlParams.get('username');

        if (urlUserId) {
            userId = parseInt(urlUserId);
            username = urlUsername || 'lonely_soul';
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id || userId;
            username = tg.initDataUnsafe.user.username || username;
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.chat) {
            chatId = tg.initDataUnsafe.chat.id;
        }

        return { user_id: userId, username: username, chat_id: chatId };
    }

    async function sendVideo() {
        if (!currentVideo) {
            showStatus('no video to send... just like no one to talk to', 'error');
            return;
        }

        showStatus('sending video into the void...', 'loading');
        tg.MainButton.showProgress();

        try {
            const requestBody = {
                user_id: currentUserData.user_id,
                chat_id: currentUserData.chat_id || currentUserData.user_id,
                url: currentVideo.url,
                video_url: currentVideo.video_url,
                file_id: currentVideo.file_id,
                title: currentVideo.title
            };

            const response = await fetch(`/api/send`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.success) {
                showStatus('video sent... but will anyone watch?', 'success');
                setTimeout(() => {
                    tg.close();
                }, 2000);
            } else {
                showStatus(`error: ${data.error}... just like everything else`, 'error');
                tg.MainButton.hideProgress();
            }

        } catch (error) {
            console.error('Error sending video:', error);
            showStatus('connection failed... just like everything else', 'error');
            tg.MainButton.hideProgress();
        }
    }

    tg.MainButton.onClick(sendVideo);

    // --- ANALYTICS HANDLERS ---

    // 1. DONATE BUTTON
    donateBtn.addEventListener('click', () => {
        console.log("Analytics: Fake Donation");

        window.dataLayer.push({
            "ecommerce": {
                "currencyCode": "RUB",
                "purchase": {
                    "actionField": {
                        "id": "VOID-" + Math.floor(Math.random() * 10000),
                        "revenue": "100.00"
                    },
                    "products": [
                        {
                            "id": "DONATE_100",
                            "name": "Donation to Void",
                            "price": 100.00,
                            "brand": "SilentTears",
                            "category": "Donation",
                            "quantity": 1
                        }
                    ]
                }
            }
        });

        if (typeof ym !== 'undefined') {
            ym(106654533, 'reachGoal', 'donate_click');
        }

        alert("Спасибо (Test donate: данные о 'покупке' отправлены в Метрику)");
    });

    // 2. TELEGRAM LINK
    tgLink.addEventListener('click', () => {
        console.log("Analytics: Telegram Link Click");
        if (typeof ym !== 'undefined') {
            ym(106654533, 'reachGoal', 'click_telegram');
        }
    });

    // 3. MAIN DOWNLOAD HANDLER
    downloadBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();

        if (!url) {
            showStatus('no url provided... just like no purpose', 'error');
            return;
        }

        if (!url.includes('tiktok.com')) {
            showStatus('not a tiktok link... just like nothing makes sense anymore', 'error');
            return;
        }

        // Analytics
        if (typeof ym !== 'undefined') {
            ym(106654533, 'reachGoal', 'try_download');
        }

        downloadBtn.disabled = true;
        spinner.classList.add('active');
        showStatus('downloading... another moment of false hope', 'loading');
        videoInfo.style.display = 'none';
        tg.MainButton.hide();

        try {
            currentUserData = getUserData();

            const response = await fetch(`/api/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    url: url,
                    user_id: currentUserData.user_id,
                    username: currentUserData.username
                })
            });

            const data = await response.json();

            if (data.success) {
                currentVideo = {
                    url: url,
                    video_url: data.video_url,
                    file_id: data.file_id,
                    title: data.title,
                    uploader: data.uploader
                };

                videoTitle.textContent = data.title;
                videoAuthor.textContent = `uploader: ${data.uploader || 'unknown entity'}`;
                videoInfo.style.display = 'block';

                showStatus('download complete... temporary relief', 'success');

                tg.MainButton.setText('send into void');
                tg.MainButton.show();
                tg.MainButton.enable();

            } else {
                showStatus(`error: ${data.error}... expected nothing less`, 'error');
            }

        } catch (error) {
            console.error('Error:', error);
            showStatus('failed again... why am I surprised?', 'error');
        } finally {
            downloadBtn.disabled = false;
            spinner.classList.remove('active');
        }
    });

    function showStatus(message, type) {
        status.textContent = message;
        status.className = `status ${type}`;
    }

    window.addEventListener('load', () => {
        console.log('~rain drops on the window~');
        urlInput.focus();
    });

    const titleElement = document.querySelector('#titleText');
    const dotsElement = document.querySelector('#dots');
    const originalText = titleElement.textContent;
    let i = 0;
    titleElement.textContent = '';

    function typeWriter() {
        if (i < originalText.length) {
            titleElement.textContent += originalText.charAt(i);
            i++;
            setTimeout(typeWriter, 150);
        }
    }
    setTimeout(typeWriter, 1000);

    function animateDots() {
        let dotCount = 0;
        dotsElement.textContent = '';
        const dotInterval = setInterval(() => {
            switch(dotCount) {
                case 0: dotsElement.textContent = '.'; break;
                case 1: dotsElement.textContent = '..'; break;
                case 2: dotsElement.textContent = '...'; break;
                case 3: dotsElement.textContent = ''; break;
            }
            dotCount = (dotCount + 1) % 4;
        }, 500);
    }
    setTimeout(animateDots, 1000 + (originalText.length * 150));
    </script>
