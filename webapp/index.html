<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.loading {
            display: block;
            background-color: var(--tg-theme-hint-color, #f0f0f0);
        }

        .status.success {
            display: block;
            background-color: #4CAF50;
            color: white;
        }

        .status.error {
            display: block;
            background-color: #f44336;
            color: white;
        }

        .video-info {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            border-radius: 8px;
            display: none;
        }

        .video-info h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .video-info p {
            color: var(--tg-theme-hint-color, #999);
            margin: 5px 0;
        }

        .spinner {
            border: 3px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 3px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .spinner.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TikTok Downloader</h1>

        <div class="input-group">
            <label for="url">Ссылка на TikTok видео:</label>
            <input
                type="text"
                id="url"
                placeholder="https://www.tiktok.com/@user/video/..."
            >
        </div>

        <button id="downloadBtn">Скачать видео</button>

        <div class="spinner" id="spinner"></div>

        <div class="status" id="status"></div>

        <div class="video-info" id="videoInfo">
            <h3 id="videoTitle"></h3>
            <p id="videoAuthor"></p>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Применяем тему Telegram
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';

        const urlInput = document.getElementById('url');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const videoInfo = document.getElementById('videoInfo');
        const videoTitle = document.getElementById('videoTitle');
        const videoAuthor = document.getElementById('videoAuthor');

        let currentVideo = null;

        // Обработчик кнопки скачивания
        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Введите ссылку на TikTok видео', 'error');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showStatus('Неверная ссылка на TikTok', 'error');
                return;
            }

            // Показываем загрузку
            downloadBtn.disabled = true;
            spinner.classList.add('active');
            showStatus('Скачиваю видео...', 'loading');
            videoInfo.style.display = 'none';

            try {
                // Отправляем запрос боту
                const response = await fetch(`/api/download`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        user_id: tg.initDataUnsafe?.user?.id,
                        username: tg.initDataUnsafe?.user?.username
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentVideo = data;

                    // Показываем информацию о видео
                    videoTitle.textContent = data.title;
                    videoAuthor.textContent = `Автор: ${data.uploader || 'Неизвестно'}`;
                    videoInfo.style.display = 'block';

                    showStatus('✅ Видео готово!', 'success');

                    // Показываем главную кнопку Telegram для отправки
                    tg.MainButton.setText('Отправить в чат');
                    tg.MainButton.show();
                    tg.MainButton.onClick(sendVideo);

                } else {
                    showStatus(`Ошибка: ${data.error}`, 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showStatus('Произошла ошибка при скачивании', 'error');
            } finally {
                downloadBtn.disabled = false;
                spinner.classList.remove('active');
            }
        });

        function sendVideo() {
            if (!currentVideo) return;

            // Отправляем видео в чат через Telegram Web App API
            tg.sendData(JSON.stringify({
                action: 'send_video',
                video_url: currentVideo.video_url,
                file_id: currentVideo.file_id,
                title: currentVideo.title
            }));

            // Закрываем Web App
            tg.close();
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }

        // Автофокус на поле ввода
        urlInput.focus();
    </script>
</body>
</html>
