<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.loading {
            display: block;
            background-color: var(--tg-theme-hint-color, #f0f0f0);
        }

        .status.success {
            display: block;
            background-color: #4CAF50;
            color: white;
        }

        .status.error {
            display: block;
            background-color: #f44336;
            color: white;
        }

        .video-info {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            border-radius: 8px;
            display: none;
        }

        .video-info h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .video-info p {
            color: var(--tg-theme-hint-color, #999);
            margin: 5px 0;
        }

        .spinner {
            border: 3px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 3px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        .spinner.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TikTok Downloader</h1>

        <div class="input-group">
            <label for="url">Ссылка на TikTok видео:</label>
            <input
                type="text"
                id="url"
                placeholder="https://www.tiktok.com/@user/video/..."
            >
        </div>

        <button id="downloadBtn">Скачать видео</button>

        <div class="spinner" id="spinner"></div>

        <div class="status" id="status"></div>

        <div class="video-info" id="videoInfo">
            <h3 id="videoTitle"></h3>
            <p id="videoAuthor"></p>
        </div>
    </div>

    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';

    const urlInput = document.getElementById('url');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const videoInfo = document.getElementById('videoInfo');
    const videoTitle = document.getElementById('videoTitle');
    const videoAuthor = document.getElementById('videoAuthor');

    let currentVideo = null;
    let currentUserData = null;

    // Логирование в UI для дебага
    function debugLog(message, data = null) {
        console.log(message, data || '');
        // Можно добавить визуальный лог на странице
        const logDiv = document.getElementById('debug-log');
        if (logDiv) {
            const entry = document.createElement('div');
            entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            if (data) entry.textContent += ` ${JSON.stringify(data)}`;
            logDiv.appendChild(entry);
        }
    }

    function getUserData() {
        let userId = 0;
        let username = 'unknown';
        let chatId = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('user_id');
        const urlUsername = urlParams.get('username');

        if (urlUserId) {
            userId = parseInt(urlUserId);
            username = urlUsername || 'unknown';
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id || userId;
            username = tg.initDataUnsafe.user.username || username;
        }

        if (tg.initDataUnsafe && tg.initDataUnsafe.chat) {
            chatId = tg.initDataUnsafe.chat.id;
        }

        return { user_id: userId, username: username, chat_id: chatId };
    }

    async function sendVideo() {
        if (!currentVideo) {
            showStatus('Нет видео для отправки', 'error');
            return;
        }

        showStatus('Отправляю видео...', 'loading');
        tg.MainButton.showProgress();

        try {
            // ВСЕГДА используем API метод (работает для обеих кнопок)

            const requestBody = {
                user_id: currentUserData.user_id,
                chat_id: currentUserData.chat_id || currentUserData.user_id,
                url: currentVideo.url,
                video_url: currentVideo.video_url,
                file_id: currentVideo.file_id,
                title: currentVideo.title
            };

            const response = await fetch(`/api/send`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(requestBody)
            });


            const data = await response.json();

            if (data.success) {
                showStatus('✅ Видео отправлено!', 'success');
                setTimeout(() => {
                    tg.close();
                }, 1000);
            } else {
                showStatus(`Ошибка: ${data.error}`, 'error');
                tg.MainButton.hideProgress();
            }

        } catch (error) {
            console.error('Error sending video:', error);
            showStatus('Ошибка при отправке', 'error');
            tg.MainButton.hideProgress();
        }
    }

    tg.MainButton.onClick(sendVideo);

    downloadBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();

        if (!url) {
            showStatus('Введите ссылку на TikTok видео', 'error');
            return;
        }

        if (!url.includes('tiktok.com')) {
            showStatus('Неверная ссылка на TikTok', 'error');
            return;
        }

        downloadBtn.disabled = true;
        spinner.classList.add('active');
        showStatus('Скачиваю видео...', 'loading');
        videoInfo.style.display = 'none';
        tg.MainButton.hide();

        try {
            currentUserData = getUserData();

            const response = await fetch(`/api/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    url: url,
                    user_id: currentUserData.user_id,
                    username: currentUserData.username
                })
            });

            const data = await response.json();

            if (data.success) {
                currentVideo = {
                    url: url,
                    video_url: data.video_url,
                    file_id: data.file_id,
                    title: data.title,
                    uploader: data.uploader
                };

                videoTitle.textContent = data.title;
                videoAuthor.textContent = `Автор: ${data.uploader || 'Неизвестно'}`;
                videoInfo.style.display = 'block';

                showStatus('✅ Видео готово!', 'success');

                tg.MainButton.setText('Отправить в чат');
                tg.MainButton.show();
                tg.MainButton.enable();

            } else {
                showStatus(`Ошибка: ${data.error}`, 'error');
            }

        } catch (error) {
            console.error('Error:', error);
            showStatus('Произошла ошибка при скачивании', 'error');
        } finally {
            downloadBtn.disabled = false;
            spinner.classList.remove('active');
        }
    });

    function showStatus(message, type) {
        status.textContent = message;
        status.className = `status ${type}`;
    }

    urlInput.focus();
</script>
<div id="debug-log" style="
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0,0,0,0.8);
        color: #0f0;
        font-family: monospace;
        font-size: 10px;
        padding: 10px;
        display: none;
    "></div>

    <script>
        // Показывать лог только если есть query параметр ?debug=1
        if (new URLSearchParams(window.location.search).get('debug') === '1') {
            document.getElementById('debug-log').style.display = 'block';
        }
    </script>
</body>
</body>
</html>
